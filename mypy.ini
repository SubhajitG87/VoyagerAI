[mypy]
python_version = 3.10
strict_optional = True
ignore_missing_imports = True
warn_unused_ignores = True

# Third-party stubs can use syntax newer than python_version (numpy's use the 3.12
# `type` statement), which stops mypy before it reaches our code. We only check src.
[mypy-numpy.*,pandas.*,pyarrow.*]
follow_imports = skip
follow_imports_for_stubs = True
